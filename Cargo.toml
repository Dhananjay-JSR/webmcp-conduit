[package]
name = "webmcp-conduit"
version = "0.1.0"
edition = "2021"
description = "Turn any WebMCP-enabled website into a standard MCP server. No browser required."
license = "Apache-2.0"
repository = "https://github.com/Dhananjay-JSR/webmcp-conduit"
readme = "README.md"
keywords = ["mcp", "webmcp", "ai", "agent", "model-context-protocol"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "conduit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
scraper = "0.20"
url = "2"
rquickjs = { version = "0.6", features = ["macro", "futures", "parallel", "loader"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ego-tree = "0.6.3"
regex = "1.13.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
