name: release

# A release is cut by the version in Cargo.toml changing on main. Merge a
# version bump and everything below follows: the test suite, binaries for every
# platform, checksums, a tag, a GitHub release, and the crate.
#
# Nothing is published unless the tests pass on every platform.
#
# Not every merge releases — most are README fixes and CI tweaks, and tagging
# those would be noise. The version bump is the signal.
#
# Pushing a tag by hand still works, for a release that does not come from a
# merge.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY: conduit

jobs:
  # A tag that disagrees with Cargo.toml produces a release whose binaries
  # report a different version than the tag promises. Fail before building.
  verify:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        name: Decide whether this is a release
        run: |
          manifest_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "manifest version: $manifest_version"
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # A tag that disagrees with Cargo.toml would publish binaries
            # reporting a version the tag does not promise.
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$manifest_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $manifest_version"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pushed to main: release only when this version has not been
          # released yet, so ordinary merges do nothing.
          #
          # The question is deliberately "is there a release?" rather than "is
          # there a tag?". The tag is created with the release at the end, so
          # asking about tags would let a half-finished run block a retry.
          if gh release view "v$manifest_version" >/dev/null 2>&1; then
            echo "v$manifest_version is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "v$manifest_version is not released yet; cutting one"
          echo "release=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}


  # Nothing is published until the suite passes.
  #
  # This workflow used to build binaries, check they start, and publish — with
  # no test run anywhere in it. `main` tests the same commit, but in a separate
  # workflow that runs concurrently and cannot gate this one, so a release could
  # and did go out while main was red: v0.2.0 published while the test matrix
  # had a failing job, and the failure was only noticed afterwards.
  #
  # A version cannot be unpublished. That asymmetry is the whole argument for
  # paying a few minutes here.
  test:
    name: test (${{ matrix.os }})
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same platforms main tests on. Intel macOS is absent for the same
        # reason it is there: the runners queue for many minutes. The release
        # still builds and runs that binary before packaging it.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test


  build:
    name: ${{ matrix.target }}
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows build on native runners. Both macOS targets
          # build on Apple Silicon, which ships SDKs for each architecture —
          # the Intel runners are being retired and queue long enough to
          # stall a release indefinitely.
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      ext: "" }
          - { os: macos-latest,     target: x86_64-apple-darwin,       ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Skipped for the cross-built target, since an arm64 runner cannot run
      # an x86_64 binary. Everything else is exercised before it is packaged.
      - name: Check it runs
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${BINARY}${{ matrix.ext }}"
          "$bin" --version

          # Captured rather than piped into `grep -q`. `grep -q` exits on the
          # first match and closes the pipe, so this assertion used to depend
          # on whether conduit had finished writing by then — it lost that race
          # on an arm64 macOS runner and failed a release.
          out=$("$bin" probe fixtures/todo.html)
          echo "$out" | grep -q "tools: 4"

          # And now the behaviour itself, deliberately: a reader that goes away
          # early must not crash the process. `head` is what anyone would
          # actually type, and Rust ignores SIGPIPE unless told otherwise.
          "$bin" probe fixtures/todo.html | head -1 > /dev/null

      - name: Check it is the right architecture
        if: matrix.target == 'x86_64-apple-darwin'
        run: file "target/${{ matrix.target }}/release/${BINARY}" | grep -q x86_64

      - name: Package
        shell: bash
        run: |
          name="${BINARY}-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${BINARY}${{ matrix.ext }}" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            if command -v sha256sum > /dev/null; then
              sha256sum "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
            else
              shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: [verify, build, test]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          cat *.sha256 > /dev/null 2>&1 || true
          for f in *.sha256; do
            printf '%s  %s\n' "$(cat "$f")" "${f%.sha256}"
          done > SHA256SUMS
          rm -f *.sha256
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag as part of publishing, against this commit. Tag and
          # release then appear together or not at all, so a failed build
          # leaves nothing behind and a re-run is clean.
          tag_name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: conduit ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            The installer resolves the latest release, picks the archive
            for your platform, and checks it against `SHA256SUMS`.

            Or from source:

            ```bash
            cargo install --git https://github.com/${{ github.repository }}
            ```

            Binaries for macOS, Linux and Windows are attached, with
            checksums in `SHA256SUMS`. The install script verifies them.

          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS

  crates:
    name: publish to crates.io
    # Not gated on `build`. The crate is source, so nothing about it depends on
    # a binary having been produced — but it does wait for them anyway, because
    # publishing a version that then fails to build for a platform is worse
    # than publishing a minute later.
    needs: [verify, build, test]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set — nothing was published to crates.io."
            echo "Add a CARGO_REGISTRY_TOKEN repository secret to publish on the next release."
            {
              echo "### crates.io publish skipped"
              echo ""
              echo "\`CARGO_REGISTRY_TOKEN\` is not set, so the crate was not published."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Already on crates.io is success, not failure: a re-run of a release
          # should not fail on its second attempt, and a version can only ever
          # be published once.
          #
          # The registry is asked directly rather than inferring from a dry run,
          # which skips the upload and so never notices a version already
          # exists. crates.io requires a User-Agent.
          version="${{ needs.verify.outputs.version }}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: webmcp-conduit release workflow' \
            "https://crates.io/api/v1/crates/webmcp-conduit/$version")

          if [ "$status" = "200" ]; then
            echo "webmcp-conduit $version is already on crates.io; nothing to do."
            exit 0
          fi

          cargo publish
