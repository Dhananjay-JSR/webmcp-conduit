name: release

# Cutting a release is `git tag v0.1.0 && git push --tags`. Everything below
# follows from that: binaries for every platform, checksums, and a GitHub
# release the install script can read.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY: conduit

jobs:
  # A tag that disagrees with Cargo.toml produces a release whose binaries
  # report a different version than the tag promises. Fail before building.
  verify:
    name: verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          tag_version="${tag#v}"
          manifest_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag_version manifest=$manifest_version"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $manifest_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture. The engine embeds a C
          # interpreter, so cross-compiling costs more than it saves.
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-13,         target: x86_64-apple-darwin,       ext: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check it runs
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${BINARY}${{ matrix.ext }}"
          "$bin" --version
          "$bin" probe fixtures/todo.html | grep -q "tools: 4"

      - name: Package
        shell: bash
        run: |
          name="${BINARY}-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${BINARY}${{ matrix.ext }}" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            if command -v sha256sum > /dev/null; then
              sha256sum "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
            else
              shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          cat *.sha256 > /dev/null 2>&1 || true
          for f in *.sha256; do
            printf '%s  %s\n' "$(cat "$f")" "${f%.sha256}"
          done > SHA256SUMS
          rm -f *.sha256
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: conduit ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Or with cargo:

            ```bash
            cargo install webmcp-conduit
            ```

            Checksums are in `SHA256SUMS`.
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS

  # MCP servers are installed with npx far more often than with cargo, so the
  # binaries ship through npm too: one wrapper package listing per-platform
  # packages as optionalDependencies, which is how esbuild and swc do it. npm
  # installs only the package matching the machine and downloads nothing at
  # install time.
  npm:
    name: publish to npm
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Skipped rather than failed when the token is absent, so a release still
    # completes for anyone who has not set it up.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract binaries by target
        run: |
          mkdir -p bins
          for f in artifacts/*.tar.gz; do
            tar xzf "$f" -C bins
          done
          for f in artifacts/*.zip; do
            unzip -q "$f" -d bins
          done
          # build.mjs expects bins/<rust-target>/conduit, while the archives
          # unpack to conduit-<version>-<target>/.
          version="${{ needs.verify.outputs.version }}"
          for d in bins/conduit-"$version"-*; do
            [ -d "$d" ] || continue
            target="${d#bins/conduit-$version-}"
            mkdir -p "bins/$target"
            cp "$d"/conduit* "bins/$target/" 2>/dev/null || true
          done
          find bins -maxdepth 2 -name 'conduit*' -type f | sort

      - name: Build the npm packages
        run: node npm/build.mjs "${{ needs.verify.outputs.version }}" bins

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm publish"
            exit 0
          fi
          # Platform packages first: the wrapper pins them as exact
          # optionalDependencies and would install broken without them.
          for dir in npm/dist/webmcp-conduit-*; do
            (cd "$dir" && npm publish --access public --provenance)
          done
          (cd npm/dist/webmcp-conduit && npm publish --access public --provenance)
