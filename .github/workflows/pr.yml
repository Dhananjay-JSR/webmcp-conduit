name: PR

# Fast feedback on a pull request: one platform, every check. The full
# matrix runs on main, where a slower job is not blocking anyone.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The engine embeds a C JavaScript interpreter, so an uncached build
      # is slow enough to matter on every push to a branch.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # Exercises the whole pipeline — parse, isolate, shim, harvest — which
      # the unit tests do not cover end to end.
      - name: Smoke test the CLI
        run: |
          out=$(cargo run --quiet -- probe fixtures/todo.html)
          echo "$out"
          echo "$out" | grep -q "tools: 4" || { echo "expected 4 tools"; exit 1; }

  # A release builds from whatever Cargo.toml says, so a version that does
  # not parse or a manifest that will not package should fail here rather
  # than halfway through tagging.
  # Two answers instead of one.
  #
  # `cargo test` passing says "everything is fine" and `cargo test` failing says
  # "something is wrong", and those are not the same question. A PR that breaks
  # behaviour which already worked is a regression, and one whose own new tests
  # fail is unfinished work. They deserve different reactions, and a single red
  # tick makes you open the log to tell them apart.
  split:
    name: regressions vs new tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit has to be reachable to diff against it.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compile the tests
        run: cargo test --no-run

      - name: Work out which tests are new
        id: split
        # bash explicitly, on every step below that builds an argument list in a
        # variable. Unquoted expansion splitting into separate arguments is a
        # bash behaviour, not a universal one — zsh does not do it, and the same
        # script there silently passes one giant argument that matches nothing,
        # so every test looks filtered out and both halves report success.
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"

          # Every test the suite knows about, by full path.
          #
          # `|| true` on both pipelines because the shell is `bash -e -o
          # pipefail` and grep exits 1 when it matches nothing. A PR that adds
          # no test functions — this job arrived in one — is the ordinary case,
          # not an error, and without this the step dies before it can say so.
          cargo test -- --list 2>/dev/null \
            | grep ': test$' | sed 's/: test$//' | sort -u > all.txt || true

          # Function names this PR adds. Non-test functions come along too, and
          # are dropped by the intersection below — a name only counts as a new
          # test if libtest also reports it as one.
          git diff "$base"...HEAD -- '*.rs' \
            | grep -E '^\+\s*(async )?fn ' \
            | sed -E 's/.*fn ([a-zA-Z0-9_]+).*/\1/' \
            | sort -u > added.txt || true
          touch added.txt all.txt

          : > new.txt
          while read -r test; do
            grep -qx "${test##*::}" added.txt && echo "$test" >> new.txt
          done < all.txt

          echo "total:    $(wc -l < all.txt | tr -d ' ')"
          echo "new:      $(wc -l < new.txt | tr -d ' ')"
          sed 's/^/  + /' new.txt

      - name: Existing tests must still pass
        shell: bash
        run: |
          # Everything except what this PR introduced. A failure here is a
          # regression: it worked before the PR and does not now.
          skips=""
          while read -r test; do
            skips="$skips --skip $test"
          done < new.txt

          # shellcheck disable=SC2086
          cargo test -- $skips

      - name: New tests must pass
        shell: bash
        run: |
          if [ ! -s new.txt ]; then
            echo "This PR adds no tests."
            {
              echo "### No new tests"
              echo ""
              echo "Nothing here fails because of it — but a change worth making"
              echo "is usually a change worth pinning."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # shellcheck disable=SC2046
          cargo test -- --exact $(tr '\n' ' ' < new.txt)


  packaging:
    name: crates.io packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify the crate packages cleanly
        run: cargo publish --dry-run
